jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-characters-long
jwt.expiration=86400000
spring.application.name=food-delivery-backend

spring.datasource.url=jdbc:h2:mem:food_delivery
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-flash-lite-latest